pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // Force local CLI to avoid stale npx-resolved project roots after folder rename/move.
    ex.autolinkLibrariesFromCommand(["node", "node_modules/react-native/cli.js", "config"])
}

rootProject.name = 'Farmer'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
